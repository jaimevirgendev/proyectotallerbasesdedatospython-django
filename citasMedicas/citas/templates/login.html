<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema Médico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }

        /* Estilizando los inputs de Django */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px; /* Espaciado interno */
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Para que el padding no rompa el ancho */
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #009879; /* Verde médico */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #007f65;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bienvenido</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <p class="error-message">Usuario o contraseña incorrectos.</p>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Usuario:</label>
                {{ form.username }} 
            </div>

            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                {{ form.password }}
            </div>

            <button type="submit">Ingresar</button>
        </form>
    </div>

</body>
</html>
